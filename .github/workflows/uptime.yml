name: Blog uptime

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: HTTPS check
        env:
          BLOG_URL: https://alpallovy.github.io/ayeixa-blog/
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/blog-body.html -w '%{http_code}' --max-time 20 "$BLOG_URL")"
          echo "HTTP_STATUS=$code"
          test "$code" = "200"
          grep -q "AYEIXA" /tmp/blog-body.html
